
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje bilješke</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Moje bilješke</h1>

        <!-- Registracija i prijava -->
        <div id="auth-section">

            <input
                type="email"
                id="email"
                placeholder="Unesite e-mail"
            >

            <input
                type="password"
                id="password"
                placeholder="Unesite lozinku"
            >

            <div class="auth-buttons">
                <button id="register-btn">Registracija</button>
                <button id="login-btn">Prijava</button>
            </div>

            <p id="auth-message"></p>
        </div>

        <!-- Aplikacija nakon prijave -->
        <div id="app-section" class="hidden">

            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-btn">Odjava</button>
            </div>

            <div class="add-note">
                <input
                    type="text"
                    id="note-input"
                    placeholder="Nova bilješka..."
                >

                <button id="add-note-btn">Dodaj</button>
            </div>

            <h2>Moje bilješke</h2>

            <ul id="notes-list"></ul>

        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
